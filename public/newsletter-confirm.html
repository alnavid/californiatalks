<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Confirm Your Subscription | California Talks</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/styles.css?v=20260820a" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="California Talks home">
        <img src="/assets/catalks_bear_logo.png" alt="" />
        <span>California Talks</span>
      </a>
      <!-- Standard site navigation -->
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="/#services">Services</a>
        <a href="/#proof">Proof</a>
        <a href="/#newsletter">Newsletter</a>
        <a href="/#contact">Contact</a>
        <a href="/sms-consent.html">SMS Consent</a>
        <a href="/privacy.html">Privacy</a>
      </nav>
      <div class="header-actions">
        <a class="nav-portal" href="https://clients.californiatalks.org">Client Portal</a>
        <a class="nav-cta" href="/#contact">Start a Project</a>
      </div>
    </header>
    <main class="confirmation-page">
      <section class="confirmation-card">
        <p class="section-kicker">Newsletter</p>
        <h1>Confirm your subscription.</h1>
        <p>One final click will add you to the California Talks newsletter.</p>
        <form action="/api/confirm" method="POST" id="confirmation-form">
          <input type="hidden" name="token" id="confirmation-token" />
          <button type="submit" class="button primary">Confirm subscription</button>
        </form>
        <p class="form-status error" id="confirmation-error" role="alert" hidden>
          We could not complete the confirmation. Please try again.
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <strong>California Talks</strong>
      <a href="/privacy.html">Privacy Policy</a>
    </footer>
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      const form = document.querySelector("#confirmation-form");
      const error = document.querySelector("#confirmation-error");
      if (!/^[A-Za-z0-9_-]{40,64}$/.test(token)) {
        window.location.replace("/newsletter-link-expired.html");
      } else {
        document.querySelector("#confirmation-token").value = token;
      }
      if (params.get("error") === "1") error.hidden = false;
      form.addEventListener("submit", () => {
        const button = form.querySelector("button");
        button.disabled = true;
        button.textContent = "Confirming...";
      });
    </script>
  </body>
</html>
